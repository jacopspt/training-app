<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Valutazione stress e risposta al programma — JacopsPT</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#f5f7f7;color:#2a3342;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,system-ui,sans-serif;font-size:15px;line-height:1.5}
.hd{background:#183048;color:#fff;padding:16px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.hd img{width:44px;height:44px;border-radius:50%;flex-shrink:0}
.hd b{font-size:21px;letter-spacing:.02em;display:block}
.hd .g{color:#d8a830;font-size:10px;font-weight:800;letter-spacing:.18em}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px 40px}
.intro{border-left:4px solid #d8a830;padding:2px 0 2px 14px;margin:18px 0 20px}
.intro h1{margin:0;font-size:23px;color:#183048;line-height:1.25}
.intro p{margin:6px 0 0;font-size:13.5px;color:#6b7688}
.card{background:#fff;border:1px solid #e5eaea;border-radius:16px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 3px;font-size:17px;color:#183048}
.card .sub{font-size:12.5px;color:#6b7688;margin-bottom:12px}
label.f{display:block;font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#187878;margin-bottom:5px}
input[type=text]{width:100%;padding:11px 12px;border:1px solid #dde3e3;border-radius:10px;font-size:16px;font-family:inherit}
input[type=text]:focus{outline:none;border-color:#187878}
.sez{margin-top:18px}
.sez h3{margin:0 0 10px;font-size:13px;color:#183048;letter-spacing:.03em;display:flex;align-items:center;gap:8px}
.sez h3 span{background:#e9f3f2;color:#187878;font-size:11px;font-weight:800;border-radius:20px;padding:2px 9px}
.q{padding:11px 0;border-top:1px solid #eef1f1}
.q:first-of-type{border-top:none}
.q p{margin:0 0 8px;font-size:14.5px}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{flex:1 1 88px;padding:9px 4px;border:1px solid #dde3e3;background:#fff;color:#5b636d;border-radius:999px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
.opts button.on{background:#187878;border-color:#187878;color:#fff}
.bar{position:sticky;bottom:0;background:#fff;border-top:1px solid #e5eaea;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;box-shadow:0 -3px 14px rgba(24,48,72,.07)}
.bar .prog{flex:1;min-width:150px;font-size:12.5px;color:#6b7688}
.bar .track{height:7px;background:#eef1f1;border-radius:5px;margin-top:5px;overflow:hidden}
.bar .fill{height:100%;background:#187878;width:0;transition:width .25s}
button.act{padding:11px 18px;border-radius:999px;font-size:14px;font-weight:800;cursor:pointer;border:1px solid #dde3e3;background:#fff;color:#183048;font-family:inherit}
button.act.wa{background:#25d366;border-color:#1eb457;color:#08351c}
button.act.gh{background:#183048;border-color:#183048;color:#fff}
.esito{border-radius:16px;padding:16px;color:#fff;margin-bottom:12px}
.esito .t{font-size:19px;font-weight:800;margin-bottom:3px}
.esito .n{font-size:13.5px;opacity:.94}
.punteggi{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pz{flex:1 1 170px;background:#fff;border:1px solid #e5eaea;border-radius:14px;padding:12px 14px}
.pz .lb{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#8a929b}
.pz .vl{font-size:22px;font-weight:800;margin:3px 0}
.pz .fs{font-size:12.5px;font-weight:700}
.pz .nt{font-size:12px;color:#6b7688;margin-top:3px}
.mut{font-size:12.5px;color:#8a929b}
.ft{text-align:center;font-size:11.5px;color:#9aa0a8;padding:18px 0 6px}
@media print{.bar,.noprint{display:none}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>

        "Gli allenamenti ti sembrano più duri del previsto per il tuo livello?",
        "Fatichi a completare serie e ripetizioni ai carichi assegnati?",
        "Fatichi a mantenere ritmo o tempi di recupero indicati nel piano?",
        "Percepisci lo sforzo richiesto come eccessivo rispetto a ciò che gestisci?"]},
      { titolo: "Prestazione e progressione", domande: [
        "Noti un calo di forza o prestazione rispetto alle settimane precedenti?",
        "Hai la sensazione di essere fermo/a o di regredire nonostante l'impegno?",
        "Ti capita di dover ridurre carichi o volume rispetto al programmato?",
        "Senti che il piano richiede più di quanto il corpo riesca ad adattarsi?"]},
      { titolo: "Risposta fisica al training", domande: [
        "Avverti dolori articolari o tendinei comparsi o peggiorati con questo piano?",
        "Noti pesantezza o arti stanchi già durante il riscaldamento?",
        "Hai avvertito segnali di sovraccarico nelle zone sollecitate dal programma?"]},
      { titolo: "Relazione psicologica con il programma", domande: [
        "Provi timore o riluttanza ad affrontare determinate sedute?",
        "Ti senti sotto pressione dagli obiettivi o dai numeri del programma?",
        "Percepisci il programma come fonte di stress più che di soddisfazione?",
        "Fatichi a rispettare la frequenza prevista per stanchezza da allenamento?",
        "Se potessi, alleggeriresti il carico attuale del piano?"]}
    ]
  }
];

var KEY = "jacopspt_test_stress_v1";
var stato = { nome: "", risposte: {} };
try {
  var salvato = JSON.parse(localStorage.getItem(KEY) || "null");
  if (salvato && salvato.risposte) stato = salvato;
} catch (e) {}

function nDomande(t) {
  var n = 0;
  t.sezioni.forEach(function (s) { n += s.domande.length; });
  return n;
}
function punteggio(t) {
  var p = 0, dati = 0;
  t.sezioni.forEach(function (s, si) {
    s.domande.forEach(function (_, di) {
      var v = stato.risposte[t.id + "-" + si + "-" + di];
      if (typeof v === "number") { p += v; dati++; }
    });
  });
  return { p: p, dati: dati, max: nDomande(t) * 4, tot: nDomande(t) };
}
function fascia(perc) {
  if (perc <= 25) return { nome: "Basso", colore: "#1e8e5a", nota: "Buon equilibrio tra carico e recupero: si può progredire come da programma." };
  if (perc <= 50) return { nome: "Moderato", colore: "#c9a227", nota: "Situazione gestibile: tenere d'occhio sonno e recupero." };
  if (perc <= 75) return { nome: "Elevato", colore: "#d8843c", nota: "Valutare un alleggerimento e intervenire sui fattori esterni." };
  return { nome: "Molto elevato", colore: "#c0392b", nota: "Priorità al recupero prima di aumentare il carico." };
}
function esitoIncrociato(percExtra, percPiano) {
  var e = percExtra > 50, p = percPiano > 50;
  if (!e && p) return { t: "Il problema è il programma", c: "#d8843c", n: "Il carico è oggettivamente troppo: serve un deload o una revisione della periodizzazione." };
  if (e && !p) return { t: "La vita fuori erode il recupero", c: "#c9a227", n: "Il piano regge. Si agisce su sonno, stress e recupero, non sul programma." };
  if (e && p) return { t: "Tempesta perfetta", c: "#c0392b", n: "Priorità assoluta al recupero: ridurre temporaneamente il volume." };
  return { t: "Margine per progredire", c: "#1e8e5a", n: "Entrambi i punteggi sono bassi: si può avanzare con serenità." };
}
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function salva() {
  try { localStorage.setItem(KEY, JSON.stringify(stato)); } catch (e) {}
}

function disegna() {
  var h = "";
  TEST.forEach(function (t) {
    var pt = punteggio(t);
    h += '<div class="card"><h2>' + esc(t.nome) + '</h2><div class="sub">' + esc(t.sub) +
         ' · <b>' + pt.dati + '/' + pt.tot + '</b> risposte</div>';
    t.sezioni.forEach(function (s, si) {
      h += '<div class="sez"><h3><span>' + (si + 1) + '</span>' + esc(s.titolo) + '</h3>';
      s.domande.forEach(function (d, di) {
        var k = t.id + "-" + si + "-" + di;
        var v = stato.risposte[k];
        h += '<div class="q"><p>' + esc(d) + '</p><div class="opts">';
        t.opzioni.forEach(function (o, oi) {
          h += '<button data-k="' + k + '" data-v="' + oi + '"' + (v === oi ? ' class="on"' : '') + '>' + esc(o) + '</button>';
        });
        h += '</div></div>';
      });
      h += '</div>';
    });
    h += '</div>';
  });
  document.getElementById("tests").innerHTML = h;
  aggiornaRisultato();
}

function aggiornaRisultato() {
  var a = punteggio(TEST[0]), b = punteggio(TEST[1]);
  var totDate = a.dati + b.dati, totDom = a.tot + b.tot;
  document.getElementById("stato").textContent = totDate + " di " + totDom + " risposte";
  document.getElementById("fill").style.width = Math.round(totDate / totDom * 100) + "%";

  var out = "";
  var pa = a.dati ? Math.round(a.p / a.max * 100) : null;
  var pb = b.dati ? Math.round(b.p / b.max * 100) : null;

  if (a.dati === a.tot && b.dati === b.tot) {
    var es = esitoIncrociato(pa, pb);
    out += '<div class="esito" style="background:' + es.c + '"><div class="t">' + esc(es.t) + '</div><div class="n">' + esc(es.n) + '</div></div>';
  } else {
    out += '<div class="card mut">Completa tutte le domande per vedere la lettura d\'insieme.</div>';
  }
  out += '<div class="punteggi">';
  [[TEST[0], a, pa], [TEST[1], b, pb]].forEach(function (r) {
    var f = r[2] === null ? null : fascia(r[2]);
    out += '<div class="pz"><div class="lb">' + esc(r[0].nome) + '</div>' +
           '<div class="vl" style="color:' + (f ? f.colore : "#8a929b") + '">' + r[1].p + '<span style="font-size:14px;color:#8a929b">/' + r[1].max + '</span></div>' +
           (f ? '<div class="fs" style="color:' + f.colore + '">' + f.nome + ' · ' + r[2] + '%</div><div class="nt">' + esc(f.nota) + '</div>' : '<div class="nt">da completare</div>') +
           '</div>';
  });
  out += '</div>';
  document.getElementById("risultato").innerHTML = out;
}

function riepilogo() {
  var a = punteggio(TEST[0]), b = punteggio(TEST[1]);
  var pa = a.dati ? Math.round(a.p / a.max * 100) : 0;
  var pb = b.dati ? Math.round(b.p / b.max * 100) : 0;
  var righe = [];
  righe.push("VALUTAZIONE STRESS — JacopsPT");
  righe.push("Atleta: " + (stato.nome || "—"));
  righe.push("Data: " + new Date().toLocaleDateString("it-IT"));
  righe.push("");
  righe.push("Stress fuori dall'allenamento: " + a.p + "/" + a.max + " (" + pa + "%) — " + fascia(pa).nome);
  righe.push("Risposta al programma: " + b.p + "/" + b.max + " (" + pb + "%) — " + fascia(pb).nome);
  if (a.dati === a.tot && b.dati === b.tot) {
    var es = esitoIncrociato(pa, pb);
    righe.push("");
    righe.push("Lettura d'insieme: " + es.t);
    righe.push(es.n);
  } else {
    righe.push("");
    righe.push("(questionario incompleto: " + (a.dati + b.dati) + " di " + (a.tot + b.tot) + " risposte)");
  }
  return righe.join("\n");
}

document.getElementById("nome").value = stato.nome || "";
document.getElementById("nome").addEventListener("input", function (e) { stato.nome = e.target.value; salva(); });

document.getElementById("tests").addEventListener("click", function (e) {
  var b = e.target.closest ? e.target.closest("button[data-k]") : null;
  if (!b) return;
  var k = b.getAttribute("data-k"), v = +b.getAttribute("data-v");
  if (stato.risposte[k] === v) delete stato.risposte[k]; else stato.risposte[k] = v;
  salva();
  var riga = b.parentNode;
  [].forEach.call(riga.querySelectorAll("button"), function (x) { x.className = ""; });
  if (stato.risposte[k] === v) b.className = "on";
  var card = riga.closest(".card");
  if (card) {
    var t = TEST[[].indexOf.call(document.querySelectorAll("#tests > .card"), card)];
    if (t) { var pt = punteggio(t); card.querySelector(".sub").innerHTML = t.sub + ' · <b>' + pt.dati + "/" + pt.tot + "</b> risposte"; }
  }
  aggiornaRisultato();
});

document.getElementById("btnWa").addEventListener("click", function () {
  window.open("https://wa.me/?text=" + encodeURIComponent(riepilogo()), "_blank");
});
document.getElementById("btnCopia").addEventListener("click", function () {
  var t = riepilogo();
  if (navigator.clipboard) { try { navigator.clipboard.writeText(t); } catch (e) {} }
  var ta = document.createElement("textarea");
  ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  ta.remove();
  this.textContent = "✓ Copiato";
  var b = this;
  setTimeout(function () { b.textContent = "📋 Copia"; }, 1800);
});
document.getElementById("btnStampa").addEventListener("click", function () { window.print(); });
document.getElementById("btnReset").addEventListener("click", function () {
  if (!confirm("Azzerare tutte le risposte?")) return;
  stato = { nome: document.getElementById("nome").value, risposte: {} };
  salva(); disegna();
});

disegna();
</script>
</body>
</html>
